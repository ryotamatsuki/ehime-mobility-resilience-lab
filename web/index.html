<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ehime Mobility Resilience Lab A0 foundation placeholder">
    <title>Ehime Mobility Resilience Lab | A0 Foundation</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #16283f;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(720px, calc(100% - 32px));
        padding: 32px;
        background: #ffffff;
        border: 1px solid #d8e2ef;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgb(22 40 63 / 10%);
      }
      .eyebrow {
        color: #1769aa;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 8px 0 16px;
        font-size: clamp(1.7rem, 4vw, 2.7rem);
      }
      p {
        line-height: 1.75;
      }
      .status {
        margin-top: 24px;
        padding: 16px;
        background: #eef6ff;
        border-left: 4px solid #1769aa;
      }
      a {
        color: #0b5cad;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">A0 Foundation</div>
      <h1>Ehime Mobility Resilience Lab</h1>
      <p>「もし、ここが通れなくなったら。」</p>
      <p>現在は、データ実現可能性・ライセンス・アーキテクチャ・CIの基盤を確認する段階です。道路・公共交通・物流の分析機能は、A1以降のRelease Gateを満たした後に追加されます。</p>
      <div class="status" role="status">
        Phase A foundation placeholder. This page does not claim a computed mobility result.
      </div>
      <p><a href="https://github.com/ryotamatsuki/ehime-mobility-resilience-lab/blob/main/docs/SPECIFICATION.md">開発仕様書を読む</a></p>
    </main>
  </body>
</html>
