name: Shared-origin SRI regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test web/tests/sri-security.test.cjs
