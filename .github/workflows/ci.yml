name: A1 Real Accessibility / Planning Canvas

# GitHub Pages source must be configured as GitHub Actions.
on:
  push:
    branches: [main, feature/a1-12-vulnerable-population-equity]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Run A0 foundation checks
        run: python scripts/ci/check_foundation.py
      - name: Validate public data contract
        run: python scripts/validate/run_validation.py
      - name: Execute deterministic model fixture
        run: PYTHONPATH=src python scripts/validate/run_fixture_models.py
      - name: Check Python syntax
        run: python -m compileall -q src scripts admin

  web_source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check planning-canvas source UI
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/styles.css
          test -f web/mobile.css
          test -f web/a1_10.css
          test -f web/a1_10_runtime.js
          test -f web/a1_11.css
          test -f web/a1_11_runtime.js
          test -f web/a1_12.css
          node --check web/app.js
          node --check web/a1_10_runtime.js
          node --check web/a1_11_runtime.js
          node web/tests/smoke.js web
          node web/tests/a1_10_smoke.js web
          node web/tests/a1_11_smoke.js web
          node web/tests/a1_12_smoke.js web

  a1_source_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe selected real A1 sources
        run: |
          for attempt in 1 2 3; do
            if python scripts/ingest/probe_a1_sources.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Probe official Ehime medical registry schema without logging rows
        run: |
          for attempt in 1 2 3; do
            if PYTHONPATH=src python scripts/ingest/probe_official_hospitals.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Probe official Ozu shelter workbook schema
        run: |
          for attempt in 1 2 3; do
            if python scripts/ingest/probe_ozu_shelters.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Probe official Ozu region-age population schema
        run: |
          for attempt in 1 2 3; do
            if python scripts/ingest/probe_ozu_age_population.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

  a1_real_accessibility:
    needs: [python, web_source, a1_source_probe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build A1.12 vulnerable population equity analysis
        run: |
          for attempt in 1 2 3; do
            if PYTHONPATH=src python scripts/build_network/build_a1_12.py --output outputs/a1_12; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Validate A1.12 result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('outputs/a1_12')
          result = json.loads((root / 'summary.json').read_text())
          equity = json.loads((root / 'equity_summary.json').read_text())
          geo = json.loads((root / 'vulnerable_population_access.geojson').read_text())
          td = json.loads((root / 'time_dependent_criticality.json').read_text())
          criticality = json.loads((root / 'criticality.json').read_text())
          shelters = json.loads((root / 'shelters.geojson').read_text())
          assert result['stage'] == 'A1.12' and result['status'] == 'computed'
          assert result['classification'] == 'C' and result['scenario_classification'] == 'D'
          assert result['gtfs']['snapped_stops'] == result['gtfs']['stops']
          assert result['official_registry']['official_records_without_osm_match'] == 0
          assert result['shelter_registry']['raw_workbook_published'] is False
          assert td['stage'] == 'A1.11' and len(td['rows']) == 16
          assert criticality['stage'] == 'A1.8'
          assert shelters['features']
          assert equity['stage'] == 'A1.12' and equity['status'] == 'computed'
          assert equity['interpretation']['composite_score'] is False
          current = equity['population_sources']['current_official_context']
          assert current['classification'] == 'A'
          assert current['license'] == 'CC BY 4.0'
          assert current['raw_archive_published'] is False
          assert 'not used to overwrite or downscale' in current['usage']
          mesh = equity['population_sources']['mesh_age_population']
          assert mesh['classification'] == 'B'
          assert mesh['reference_year'] == 2020
          assert 'no A1.12 downscaling' in mesh['method']
          group_ids = [item['id'] for item in equity['groups']]
          assert group_ids == ['all', '65plus', '75plus', '85plus']
          assert len(geo['features']) == result['population']['zones_in_envelope']
          for feature in geo['features']:
              p = feature['properties']
              assert 0 <= p['population_85plus'] <= p['population_75plus'] + 1e-6
              assert p['population_75plus'] <= p['population_65plus'] + 1e-6
              assert p['population_65plus'] <= p['population'] + 1e-6
          for destination in ('hospital', 'emergency', 'general', 'welfare'):
              item = equity['destinations'][destination]
              assert set(item['groups']) == set(group_ids)
              for group in group_ids:
                  metrics = item['groups'][group]
                  share = metrics['affected_share_gt1min_pct']
                  assert share is None or 0 <= share <= 100
              assert set(item['gaps_vs_all']) == {'65plus', '75plus', '85plus'}
          totals = result['vulnerable_population']['group_totals_in_analysis_envelope']
          assert 0 <= totals['85plus'] <= totals['75plus'] <= totals['65plus'] <= totals['all']
          assert result['vulnerable_population']['spatial_downscaling_performed'] is False
          print(json.dumps({
              'group_totals': totals,
              'current_official_context': current,
              'hospital': equity['destinations']['hospital'],
              'welfare': equity['destinations']['welfare'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Regression smoke A1.11 predecessor site
        run: |
          rm -rf /tmp/a1_11_compat _site
          cp -R outputs/a1_12 /tmp/a1_11_compat
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/a1_11_compat/summary.json')
          s = json.loads(p.read_text())
          s['stage'] = 'A1.11'
          s['title'] = '大洲市 A1.11 predecessor regression view'
          p.write_text(json.dumps(s, ensure_ascii=False, indent=2))
          PY
          python scripts/export_web/build_a1_11_site.py --source /tmp/a1_11_compat --destination _site
          python scripts/export_web/apply_a1_11_ui.py --site _site
          node --check _site/app.js
          node --check _site/a1_10_runtime.js
          node --check _site/a1_11_runtime.js
          node web/tests/a1_11_smoke.js _site
      - name: Build A1.12 planning canvas
        run: |
          python scripts/export_web/build_a1_12_site.py --source outputs/a1_12 --destination _site
          python scripts/export_web/apply_a1_12_ui.py --site _site
      - name: Smoke generated A1.12 site
        run: |
          node --check _site/app.js
          node --check _site/a1_10_runtime.js
          node --check _site/a1_11_runtime.js
          node web/tests/a1_12_smoke.js _site
          test -f _site/data/equity_summary.json
          test -f _site/data/vulnerable_population_access.geojson
          test -f _site/data/time_dependent_criticality.json
          test -f _site/data/shelters.geojson
          test ! -e _site/data/official_medical.xlsx
          test ! -e _site/data/ozu_shelters.xlsx
          test -z "$(find _site -type f \( -iname '*.zip' -o -iname '*.xlsx' -o -iname '*.xls' \) -print -quit)"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('_site/data/manifest.json').read_text())
          assert manifest['stage'] == 'A1.3'
          assert manifest['result_stage'] == 'A1.12'
          assert manifest['ui_release_stage'] == 'A1.12'
          required = [
              'destination-switcher', 'time-dependent-route-criticality',
              'time-dependent-trip-criticality', 'hourly-criticality-matrix',
              'vulnerable-population-65plus', 'vulnerable-population-75plus',
              'vulnerable-population-85plus', 'equity-gap-metrics',
              'equity-public-geojson', 'current-official-age-context',
          ]
          assert all(item in manifest['ui_capabilities'] for item in required)
          html = Path('_site/index.html').read_text()
          assert 'VULNERABLE POPULATION / EQUITY' in html
          assert 'data-ui-stage="A1.12"' in html
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a1-12-planning-canvas
          path: |
            outputs/a1_12
            _site
          if-no-files-found: error
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [a1_real_accessibility]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
