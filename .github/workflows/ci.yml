name: A1 Real Accessibility / Planning Canvas

# GitHub Pages source must be configured as GitHub Actions.
on:
  push:
    branches: [main, feature/a1-8-route-trip-criticality]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Run A0 foundation checks
        run: python scripts/ci/check_foundation.py
      - name: Validate public data contract
        run: python scripts/validate/run_validation.py
      - name: Execute deterministic model fixture
        run: PYTHONPATH=src python scripts/validate/run_fixture_models.py
      - name: Check Python syntax
        run: python -m compileall -q src scripts admin

  web_source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check planning-canvas source UI
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/styles.css
          test -f web/mobile.css
          node --check web/app.js
          node web/tests/smoke.js web

  a1_source_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe selected real A1 sources
        run: |
          for attempt in 1 2 3; do
            if python scripts/ingest/probe_a1_sources.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Probe official Ehime medical registry schema without logging rows
        run: |
          for attempt in 1 2 3; do
            if PYTHONPATH=src python scripts/ingest/probe_official_hospitals.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

  a1_real_accessibility:
    needs: [python, web_source, a1_source_probe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build A1.8 route/trip criticality
        run: |
          for attempt in 1 2 3; do
            if PYTHONPATH=src python scripts/build_network/build_a1_8.py --output outputs/a1_8; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Validate A1.8 result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('outputs/a1_8/summary.json').read_text())
          temporal = json.loads(Path('outputs/a1_8/temporal_profile.json').read_text())
          criticality = json.loads(Path('outputs/a1_8/criticality.json').read_text())
          facilities = json.loads(Path('outputs/a1_8/facilities.geojson').read_text())
          assert result['stage'] == 'A1.8'
          assert result['status'] == 'computed'
          assert result['classification'] == 'C'
          assert result['scenario_classification'] == 'D'
          assert result['gtfs']['snapped_stops'] == result['gtfs']['stops']
          assert result['official_registry']['verified_osm_hospitals'] >= 1
          assert result['official_registry']['official_records_without_osm_match'] == 0
          assert result['official_registry']['raw_workbook_published'] is False
          assert all(f['properties'].get('officially_verified') is True for f in facilities['features'])
          assert result['transfer_network']['directed_edges'] > 0
          assert result['temporal_window']['slots'] == 16
          assert len(temporal['rows']) == 16
          assert criticality['stage'] == 'A1.8'
          assert len(criticality['route_ranking']) == result['gtfs']['active_routes']
          assert len(criticality['trip_ranking']) == result['gtfs']['active_trips']
          assert len(criticality['route_ranking']) >= 2
          assert len(criticality['trip_ranking']) >= 2
          assert [x['rank'] for x in criticality['route_ranking']] == list(range(1, len(criticality['route_ranking']) + 1))
          assert [x['rank'] for x in criticality['trip_ranking']] == list(range(1, len(criticality['trip_ranking']) + 1))
          for items in (criticality['route_ranking'], criticality['trip_ranking']):
              keys = [(x['impact']['population_with_gt_1min_increase'], x['impact']['mean_minutes_change']) for x in items]
              assert keys == sorted(keys, key=lambda x: (-x[0], -x[1]))
              assert all(x['impact']['mean_minutes_change'] >= -1e-6 for x in items)
          print(json.dumps({
              'top_route': criticality['route_ranking'][0],
              'top_trip': criticality['trip_ranking'][0],
              'counts': {'routes': len(criticality['route_ranking']), 'trips': len(criticality['trip_ranking'])},
          }, ensure_ascii=False, indent=2))
          PY
      - name: Build planning canvas from A1.8
        run: python scripts/export_web/build_a1_2_demo.py --source outputs/a1_8 --destination _site
      - name: Validate generated planning canvas
        run: |
          node --check _site/app.js
          node web/tests/smoke.js _site
          test -f _site/data/temporal_profile.json
          test -f _site/data/criticality.json
          test ! -e _site/data/official_medical.xlsx
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('_site/data/manifest.json').read_text())
          assert manifest['stage'] == 'A1.3'
          assert manifest['result_stage'] == 'A1.8'
          for capability in ['official-hospital-verification-gate','stop-to-stop-walking-transfer','full-day-temporal-resilience','route-criticality-ranking','trip-criticality-ranking']:
              assert capability in manifest['ui_capabilities']
          html = Path('_site/index.html').read_text()
          assert 'SERVICE CRITICALITY' in html
          assert '路線 Top 3' in html
          assert '便 Top 3' in html
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a1-8-planning-canvas
          path: |
            outputs/a1_8
            _site
          if-no-files-found: error
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [a1_real_accessibility]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
