name: A1 Real Accessibility / Planning Canvas

# GitHub Pages source must be configured as GitHub Actions.
on:
  push:
    branches: [main, feature/a1-10-destination-switcher]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Run A0 foundation checks
        run: python scripts/ci/check_foundation.py
      - name: Validate public data contract
        run: python scripts/validate/run_validation.py
      - name: Execute deterministic model fixture
        run: PYTHONPATH=src python scripts/validate/run_fixture_models.py
      - name: Check Python syntax
        run: python -m compileall -q src scripts admin

  web_source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check planning-canvas source UI
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/styles.css
          test -f web/mobile.css
          test -f web/a1_10.css
          test -f web/a1_10_runtime.js
          node --check web/app.js
          node --check web/a1_10_runtime.js
          node web/tests/smoke.js web
          node web/tests/a1_10_smoke.js web

  a1_source_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe selected real A1 sources
        run: |
          for attempt in 1 2 3; do
            if python scripts/ingest/probe_a1_sources.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Probe official Ehime medical registry schema without logging rows
        run: |
          for attempt in 1 2 3; do
            if PYTHONPATH=src python scripts/ingest/probe_official_hospitals.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Probe official Ozu shelter workbook schema
        run: |
          for attempt in 1 2 3; do
            if python scripts/ingest/probe_ozu_shelters.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

  a1_real_accessibility:
    needs: [python, web_source, a1_source_probe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build A1.9 shelter accessibility
        run: |
          for attempt in 1 2 3; do
            if PYTHONPATH=src python scripts/build_network/build_a1_9.py --output outputs/a1_9; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Validate A1.9 result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('outputs/a1_9/summary.json').read_text())
          criticality = json.loads(Path('outputs/a1_9/criticality.json').read_text())
          temporal = json.loads(Path('outputs/a1_9/temporal_profile.json').read_text())
          shelters = json.loads(Path('outputs/a1_9/shelters.geojson').read_text())
          shelter_access = json.loads(Path('outputs/a1_9/shelter_accessibility.json').read_text())
          shelter_mesh = json.loads(Path('outputs/a1_9/shelter_population_access.geojson').read_text())
          assert result['stage'] == 'A1.9'
          assert result['status'] == 'computed'
          assert result['classification'] == 'C'
          assert result['scenario_classification'] == 'D'
          assert result['gtfs']['snapped_stops'] == result['gtfs']['stops']
          assert result['official_registry']['official_records_without_osm_match'] == 0
          assert result['official_registry']['raw_workbook_published'] is False
          assert result['transfer_network']['directed_edges'] > 0
          assert result['temporal_window']['slots'] == 16
          assert len(temporal['rows']) == 16
          assert len(criticality['route_ranking']) == result['gtfs']['active_routes']
          assert len(criticality['trip_ranking']) == result['gtfs']['active_trips']
          registry = result['shelter_registry']
          assert registry['license'] == 'CC BY 4.0'
          assert registry['citywide_counts'] == {'emergency': 60, 'general': 96, 'welfare': 20}
          assert registry['raw_workbook_published'] is False
          assert shelter_access['stage'] == 'A1.9'
          assert len(shelter_mesh['features']) == result['population']['zones_in_envelope']
          assert shelters['features']
          for kind in ('emergency', 'general', 'welfare'):
              item = result['shelter_accessibility'][kind]
              assert item['usable_destinations'] > 0
              assert item['baseline']['reachable_30min'] >= item['disrupted']['reachable_30min']
              assert item['baseline']['reachable_60min'] >= item['disrupted']['reachable_60min']
              assert item['impact']['mean_minutes_change'] >= -1e-6
              stats = registry['matching']['by_kind'][kind]
              assert stats['official_records'] == registry['citywide_counts'][kind]
              assert stats['snapped_records'] == item['usable_destinations']
              public_count = sum(1 for f in shelters['features'] if f['properties']['kind'] == kind)
              assert public_count == item['usable_destinations']
          public_ids = {f['properties']['shelter_id'] for f in shelters['features']}
          assert len(public_ids) == len(shelters['features']) > 0
          assert result['osm']['hospital_destinations'] > 0
          print(json.dumps({
              'hospital_destinations': result['osm']['hospital_destinations'],
              'shelter_matching': registry['matching']['by_kind'],
              'shelter_accessibility': {
                  k: {
                      'usable_destinations': v['usable_destinations'],
                      'baseline_30min': v['baseline']['reachable_30min'],
                      'disrupted_30min': v['disrupted']['reachable_30min'],
                      'affected_gt1min': v['impact']['population_with_gt_1min_increase'],
                      'mean_change': v['impact']['mean_minutes_change'],
                  } for k, v in result['shelter_accessibility'].items()
              },
          }, ensure_ascii=False, indent=2))
          PY
      - name: Build generated A1.9 planning canvas
        run: python scripts/export_web/build_a1_2_demo.py --source outputs/a1_9 --destination _site
      - name: Smoke generated A1.9 site before A1.10
        run: |
          node --check _site/app.js
          node web/tests/smoke.js _site
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('_site/data/manifest.json').read_text())
          assert manifest['result_stage'] == 'A1.9'
          assert manifest.get('ui_release_stage') is None
          assert 'shelter-map-layer' not in manifest['ui_capabilities']
          PY
      - name: Apply A1.10 destination switcher UI
        run: python scripts/export_web/apply_a1_10_ui.py --site _site
      - name: Smoke generated A1.10 site
        run: |
          node --check _site/app.js
          node --check _site/a1_10_runtime.js
          node web/tests/a1_10_smoke.js _site
          test -f _site/data/temporal_profile.json
          test -f _site/data/criticality.json
          test -f _site/data/shelters.geojson
          test -f _site/data/shelter_accessibility.json
          test -f _site/data/shelter_population_access.geojson
          test ! -e _site/data/official_medical.xlsx
          test ! -e _site/data/ozu_shelters.xlsx
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('_site/data/manifest.json').read_text())
          assert manifest['stage'] == 'A1.3'
          assert manifest['result_stage'] == 'A1.9'
          assert manifest['ui_release_stage'] == 'A1.10'
          required = [
              'official-hospital-verification-gate', 'stop-to-stop-walking-transfer',
              'full-day-temporal-resilience', 'route-criticality-ranking',
              'trip-criticality-ranking', 'official-shelter-registry',
              'shelter-location-verification-gate', 'emergency-shelter-accessibility',
              'general-shelter-accessibility', 'welfare-shelter-accessibility',
              'destination-switcher', 'shelter-map-layer',
              'destination-synchronized-metrics', 'destination-synchronized-charts',
              'destination-provenance-popups',
          ]
          assert all(item in manifest['ui_capabilities'] for item in required)
          html = Path('_site/index.html').read_text()
          assert 'href="a1_10.css"' in html
          assert 'src="a1_10_runtime.js"' in html
          assert 'data-ui-stage="A1.10"' in html
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a1-10-planning-canvas
          path: |
            outputs/a1_9
            _site
          if-no-files-found: error
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [a1_real_accessibility]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
