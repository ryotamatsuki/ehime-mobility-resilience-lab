name: A1 Real Accessibility / Planning Canvas

# GitHub Pages source must be configured as GitHub Actions.
on:
  push:
    branches: [main, feature/a1-7-temporal-resilience]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Run A0 foundation checks
        run: python scripts/ci/check_foundation.py
      - name: Validate public data contract
        run: python scripts/validate/run_validation.py
      - name: Execute deterministic model fixture
        run: PYTHONPATH=src python scripts/validate/run_fixture_models.py
      - name: Check Python syntax
        run: python -m compileall -q src scripts admin

  web_source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check planning-canvas source UI
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/styles.css
          test -f web/mobile.css
          node --check web/app.js
          node web/tests/smoke.js web

  a1_source_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe selected real A1 sources
        run: |
          for attempt in 1 2 3; do
            if python scripts/ingest/probe_a1_sources.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Probe official Ehime medical registry schema without logging rows
        run: |
          for attempt in 1 2 3; do
            if PYTHONPATH=src python scripts/ingest/probe_official_hospitals.py; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

  a1_real_accessibility:
    needs: [python, web_source, a1_source_probe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build A1.7 full-day temporal resilience
        run: |
          for attempt in 1 2 3; do
            if PYTHONPATH=src python scripts/build_network/build_a1_7.py --output outputs/a1_7; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Validate A1.7 result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('outputs/a1_7/summary.json').read_text())
          temporal = json.loads(Path('outputs/a1_7/temporal_profile.json').read_text())
          facilities = json.loads(Path('outputs/a1_7/facilities.geojson').read_text())
          assert result['stage'] == 'A1.7'
          assert result['status'] == 'computed'
          assert result['classification'] == 'C'
          assert result['scenario_classification'] == 'D'
          assert result['gtfs']['snapped_stops'] == result['gtfs']['stops']
          assert result['official_registry']['verified_osm_hospitals'] >= 1
          assert result['official_registry']['official_records_without_osm_match'] == 0
          assert result['official_registry']['raw_workbook_published'] is False
          assert len(facilities['features']) == result['osm']['hospital_destinations']
          assert all(f['properties'].get('officially_verified') is True for f in facilities['features'])
          assert result['transfer_network']['directed_edges'] > 0
          assert result['temporal_window']['start'] == '06:00'
          assert result['temporal_window']['end'] == '21:00'
          assert result['temporal_window']['step_minutes'] == 60
          assert result['temporal_window']['slots'] == 16
          assert temporal['stage'] == 'A1.7'
          assert len(temporal['rows']) == 16
          assert [r['departure_time'] for r in temporal['rows']] == [f'{h:02d}:00' for h in range(6,22)]
          assert all(r['baseline']['reachable_30min'] >= r['disrupted']['reachable_30min'] for r in temporal['rows'])
          assert all(r['baseline']['reachable_60min'] >= r['disrupted']['reachable_60min'] for r in temporal['rows'])
          print(json.dumps({
              'temporal_resilience': result['temporal_resilience'],
              'reference_impact': result['impact'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Build planning canvas from A1.7
        run: python scripts/export_web/build_a1_2_demo.py --source outputs/a1_7 --destination _site
      - name: Validate generated planning canvas
        run: |
          node --check _site/app.js
          node web/tests/smoke.js _site
          test -f _site/data/temporal_profile.json
          test ! -e _site/data/official_medical.xlsx
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('_site/data/manifest.json').read_text())
          assert manifest['stage'] == 'A1.3'
          assert manifest['result_stage'] == 'A1.7'
          assert 'official-hospital-verification-gate' in manifest['ui_capabilities']
          assert 'stop-to-stop-walking-transfer' in manifest['ui_capabilities']
          assert 'full-day-temporal-resilience' in manifest['ui_capabilities']
          assert 'hourly-impact-profile' in manifest['ui_capabilities']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a1-7-planning-canvas
          path: |
            outputs/a1_7
            _site
          if-no-files-found: error
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [a1_real_accessibility]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
